# /etc/nginx/sites-available/silga 로 설치.
# 프론트 정적 빌드(frontend/dist)를 서빙하고, /api/ 요청만 로컬 uvicorn(8000)으로
# 리버스 프록시. 프론트는 빌드 시 VITE_API_BASE=/api로 설정해야 함
# (deploy/README.md 참조) — 그러면 같은 오리진 요청이라 CORS 자체가 필요 없어짐.
server {
    listen 80;
    server_name _;

    root /opt/silga/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 빌드 저장(POST /builds)이 부품마다 danawa.get_product()를 순차
        # 호출함(main.py::create_build, 매너 크롤링 원칙상 병렬화 안 함) —
        # e2-micro 저사양+해외 스크래핑 왕복 지연 겹치면 부품 많은 빌드는
        # nginx 기본 60초 타임아웃을 넘길 수 있어 넉넉하게 늘림
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA 라우팅 — 존재하지 않는 경로는 index.html로 넘겨서 React Router가 처리
    location / {
        try_files $uri /index.html;
    }
}
