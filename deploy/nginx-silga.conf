# /etc/nginx/sites-available/silga 로 설치.
# 프론트 정적 빌드(frontend/dist)를 서빙하고, /api/ 요청만 로컬 uvicorn(8000)으로
# 리버스 프록시. 프론트는 빌드 시 VITE_API_BASE=/api로 설정해야 함
# (deploy/README.md 참조) — 그러면 같은 오리진 요청이라 CORS 자체가 필요 없어짐.
server {
    listen 80;
    server_name _;

    root /opt/silga/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 라우팅 — 존재하지 않는 경로는 index.html로 넘겨서 React Router가 처리
    location / {
        try_files $uri /index.html;
    }
}
